<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="100%" height="100%" style="background-color: #070a13; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <!-- Glowing Neon Glow Filters -->
    <filter id="glow-cyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-green" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="glow-amber" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>

    <linearGradient id="alb-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0284c7"/><stop offset="100%" stop-color="#0369a1"/></linearGradient>
    <linearGradient id="ecs-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#059669"/><stop offset="100%" stop-color="#047857"/></linearGradient>
    <linearGradient id="db-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#d97706"/><stop offset="100%" stop-color="#b45309"/></linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#070a13"/>
  <text x="500" y="25" fill="#64748b" font-size="13" font-weight="600" text-anchor="middle">AWS 3-Tier Architecture</text>

  <!-- USER / ROUTE 53 -->
  <rect x="10" y="140" width="110" height="80" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5"/>
  <text x="65" y="170" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Users / Internet</text>
  <text x="65" y="195" fill="#94a3b8" font-size="10" text-anchor="middle">Route 53 (HTTPS)</text>

  <!-- PATH 1: USER -> IGW -->
  <path id="p1" d="M 120 180 L 170 180" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#00f0ff" filter="url(#glow-cyan)">
    <animateMotion dur="0.8s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion>
  </circle>

  <!-- AWS REGION -->
  <rect x="160" y="45" width="830" height="345" rx="8" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="5,5" opacity="0.5"/>
  <text x="175" y="62" fill="#ea580c" font-size="10" font-weight="600">AWS Region</text>

  <!-- IGW -->
  <rect x="170" y="155" width="40" height="50" rx="5" fill="#1e293b" stroke="#ea580c" stroke-width="1.5"/>
  <text x="190" y="185" fill="#ea580c" font-size="10" font-weight="700" text-anchor="middle">IGW</text>

  <!-- PATH 2: IGW -> ALB -->
  <path id="p2" d="M 210 180 L 270 180" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#00f0ff" filter="url(#glow-cyan)">
    <animateMotion dur="0.8s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion>
  </circle>

  <!-- VPC -->
  <rect x="250" y="75" width="725" height="300" rx="8" fill="#030712" stroke="#2563eb" stroke-width="1.5"/>
  <text x="265" y="92" fill="#60a5fa" font-size="10" font-weight="600">VPC (10.0.0.0/16)</text>

  <!-- PUBLIC SUBNET -->
  <rect x="260" y="105" width="160" height="255" rx="6" fill="#0b1329" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="270" y="122" fill="#fbbf24" font-size="9" font-weight="600">Public Subnet</text>

  <!-- ALB -->
  <rect x="270" y="145" width="140" height="70" rx="6" fill="url(#alb-bg)" stroke="#38bdf8" stroke-width="1"/>
  <text x="340" y="175" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">AWS ALB</text>
  <text x="340" y="193" fill="#bae6fd" font-size="9" text-anchor="middle">SSL Terminated</text>

  <!-- PATH 3: ALB -> FRONTEND -->
  <path id="p3" d="M 410 180 L 490 150" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#00ff88" filter="url(#glow-green)">
    <animateMotion dur="0.8s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion>
  </circle>

  <!-- PRIVATE APP SUBNET -->
  <rect x="470" y="105" width="260" height="255" rx="6" fill="#022c22" fill-opacity="0.2" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="480" y="122" fill="#34d399" font-size="9" font-weight="600">Private App Subnet</text>

  <!-- ECS CLUSTER -->
  <rect x="480" y="130" width="240" height="135" rx="6" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
  <text x="600" y="145" fill="#a7f3d0" font-size="9" font-weight="600" text-anchor="middle">ECS Fargate Cluster</text>

  <!-- FRONTEND -->
  <rect x="490" y="155" width="220" height="40" rx="5" fill="url(#ecs-bg)" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="180" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Frontend Task Container</text>

  <!-- PATH 4: FRONTEND -> BACKEND -->
  <path id="p4" d="M 600 195 L 600 215" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#00ff88" filter="url(#glow-green)">
    <animateMotion dur="0.6s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion>
  </circle>

  <!-- BACKEND -->
  <rect x="490" y="215" width="220" height="40" rx="5" fill="url(#ecs-bg)" stroke="#34d399" stroke-width="1"/>
  <text x="600" y="240" fill="#ffffff" font-size="11" font-weight="700" text-anchor="middle">Backend API Container</text>

  <!-- SECRETS MANAGER -->
  <rect x="490" y="280" width="220" height="65" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="600" y="307" fill="#fbbf24" font-size="11" font-weight="700" text-anchor="middle">AWS Secrets Manager</text>
  <text x="600" y="325" fill="#94a3b8" font-size="9" text-anchor="middle">Dynamic DB Credentials</text>

  <!-- PATH 5: SECRETS MANAGER -> BACKEND -->
  <path id="p5" d="M 600 280 L 600 255" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#ffb700" filter="url(#glow-amber)">
    <animateMotion dur="0.7s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion>
  </circle>

  <!-- PATH 6: BACKEND -> MARIADB -->
  <path id="p6" d="M 710 235 L 775 235" stroke="#1e293b" stroke-width="3"/>
  <circle r="4" fill="#00ff88" filter="url(#glow-green)">
    <animateMotion dur="0.8s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion>
  </circle>

  <!-- PRIVATE DB SUBNET -->
  <rect x="760" y="105" width="200" height="255" rx="6" fill="#451a03" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="770" y="122" fill="#fbbf24" font-size="9" font-weight="600">Private DB Subnet</text>

  <!-- MARIADB -->
  <rect x="775" y="195" width="170" height="80" rx="6" fill="url(#db-bg)" stroke="#fbbf24" stroke-width="1"/>
  <text x="860" y="230" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">MariaDB</text>
  <text x="860" y="250" fill="#fef3c7" font-size="9" text-anchor="middle">Isolated DB Volume (3306)</text>
</svg>
